openapi: 3.0.3
info:
  title: ToDo List API
  version: 1.0.0
  description: API para gestión de tareas
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        Endpoint de registro de usuarios.

        Utiliza RegisterSerializer para validar y crear el usuario.
        No requiere autenticación: cualquier cliente puede registrarse.
        La respuesta refleja exactamente la representación de salida
        definida por RegisterSerializer (id, username).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/tasks/:
    get:
      operationId: v1_tasks_list
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      parameters:
      - in: query
        name: completed
        schema:
          type: boolean
      - in: query
        name: deleted
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: ''
    post:
      operationId: v1_tasks_create
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}/:
    get:
      operationId: v1_tasks_retrieve
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este task.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: v1_tasks_partial_update
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este task.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskUpdate'
          description: ''
    delete:
      operationId: v1_tasks_destroy
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este task.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/{id}/restore/:
    post:
      operationId: v1_tasks_restore_create
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este task.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/reorder/:
    post:
      operationId: v1_tasks_reorder_create
      description: |-
        CRUD base de Task, más las acciones restore y reorder.

        Todas las operaciones están aisladas al usuario autenticado
        mediante request.user. No existe PUT. DELETE realiza soft delete
        en lugar de eliminación física. Filtrado, búsqueda y ordenamiento
        solo se aplican en `list`; las acciones de detalle no deben verse
        afectadas por parámetros de query incidentales.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReorderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskReorderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskReorderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    PaginatedTaskList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    PatchedTaskUpdateRequest:
      type: object
      description: |-
        Serializer de actualización parcial (PATCH).

        Permite únicamente `title` y `completed`, ambos opcionales. No
        permite modificar ningún otro campo del modelo.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        completed:
          type: boolean
    Register:
      type: object
      description: |-
        Serializer de registro de usuarios.

        Acepta `username` y `password`. La contraseña se valida con los
        validadores estándar de Django y se almacena mediante
        `set_password`, nunca en texto plano. La representación de salida
        expone únicamente `id` y `username`; `password` nunca se serializa
        de vuelta al cliente.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          maxLength: 150
      required:
      - id
      - username
    RegisterRequest:
      type: object
      description: |-
        Serializer de registro de usuarios.

        Acepta `username` y `password`. La contraseña se valida con los
        validadores estándar de Django y se almacena mediante
        `set_password`, nunca en texto plano. La representación de salida
        expone únicamente `id` y `username`; `password` nunca se serializa
        de vuelta al cliente.
      properties:
        username:
          type: string
          minLength: 1
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Task:
      type: object
      description: |-
        Representación de una tarea para listado, detalle, y respuestas
        tras crear, actualizar, restaurar o reordenar.

        No expone `user`: el aislamiento por usuario se resuelve en la
        capa de queryset/vista, no es necesario reflejarlo aquí.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        completed:
          type: boolean
          readOnly: true
        position:
          type: integer
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed
      - created_at
      - deleted_at
      - id
      - is_deleted
      - position
      - title
      - updated_at
    TaskCreateRequest:
      type: object
      description: |-
        Serializer de creación de tareas.

        Acepta únicamente `title` y `completed`. El usuario propietario y
        la posición inicial se asignan en la capa de vista/servicio, no
        aquí. Los campos técnicos (`user`, `position`, `is_deleted`,
        `deleted_at`, `created_at`, `updated_at`) quedan fuera de este
        serializer por completo: no se aceptan ni se calculan en este
        paso.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        completed:
          type: boolean
          default: false
      required:
      - title
    TaskReorderRequest:
      type: object
      description: |-
        Valida la estructura del payload de reordenamiento en lote:

            {"task_ids": [1, 3, 2, 4]}

        Solo valida forma (presencia, tipo lista, no vacía, elementos
        enteros). La validación de pertenencia al usuario y de
        coincidencia exacta con el conjunto de tareas activas es
        responsabilidad de tasks/services.py, no de este serializer.
      properties:
        task_ids:
          type: array
          items:
            type: integer
      required:
      - task_ids
    TaskUpdate:
      type: object
      description: |-
        Serializer de actualización parcial (PATCH).

        Permite únicamente `title` y `completed`, ambos opcionales. No
        permite modificar ningún otro campo del modelo.
      properties:
        title:
          type: string
          maxLength: 255
        completed:
          type: boolean
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
